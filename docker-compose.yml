services:
  postgres:
    container_name: tennis-coach-postgres
    image: postgres:17.6-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: tennis
      POSTGRES_PASSWORD: tennis_dev
      POSTGRES_DB: tennis_coach
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tennis -d tennis_coach"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    container_name: tennis-coach-api
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
      - ./data:/app/data
    working_dir: /app/backend
    env_file:
      - ./backend/.env
    environment:
      - LOG_LEVEL=DEBUG
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  frontend:
    container_name: tennis-coach-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    env_file:
      - ./frontend/.env
    depends_on:
      - backend
    restart: unless-stopped

  redis:
    container_name: tennis-coach-redis
    image: redis:alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  worker:
    container_name: tennis-coach-worker
    build:
      context: .
      dockerfile: Dockerfile.worker
      target: development
    volumes:
      - ./backend:/app/backend
      - ./data:/app/data
    working_dir: /app/backend
    env_file:
      - ./backend/.env
    environment:
      - LOG_LEVEL=DEBUG
      - REDIS_URL=redis://redis:6379/0
      - SERVICE_TYPE=worker
      - OBJC_DISABLE_INITIALIZE_FORK_SAFETY=YES
    command: python scripts/start_rq_worker.py
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      backend:
        condition: service_started
    restart: unless-stopped

  rq-dashboard:
    container_name: tennis-coach-rq-dashboard
    image: python:3.11-slim
    ports:
      - "9181:9181"
    working_dir: /app
    environment:
      - REDIS_URL=redis://redis:6379/0
    command: >
      sh -c "
        pip install --no-cache-dir rq-dashboard &&
        rq-dashboard --redis-url=redis://redis:6379/0 --port=9181
      "
    depends_on:
      - redis
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  frontend_node_modules:
