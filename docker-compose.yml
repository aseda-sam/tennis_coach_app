services:
  backend:
    container_name: tennis-coach-api
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
      - ./data:/app/data
    working_dir: /app/backend
    environment:
      - DEBUG=True
      - DATABASE_URL=sqlite:///../data/database/tennis_coach.db
      - LOG_LEVEL=DEBUG
    depends_on:
      - redis
    restart: unless-stopped

  frontend:
    container_name: tennis-coach-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - REACT_APP_API_URL=http://localhost:8000/v0
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - backend
    restart: unless-stopped

  redis:
    container_name: tennis-coach-redis
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  redis_data:
