services:
  backend:
    container_name: tennis-coach-api
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
      - ./data:/app/data
    working_dir: /app/backend
    env_file:
      - ./backend/.env
    environment:
      - LOG_LEVEL=DEBUG
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    restart: unless-stopped

  frontend:
    container_name: tennis-coach-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    env_file:
      - ./frontend/.env
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - backend
    restart: unless-stopped

  redis:
    container_name: tennis-coach-redis
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  worker:
    container_name: tennis-coach-worker
    build:
      context: .
      dockerfile: Dockerfile.worker
      target: development
    volumes:
      - ./backend:/app/backend
      - ./data:/app/data
    working_dir: /app/backend
    env_file:
      - ./backend/.env
    environment:
      - LOG_LEVEL=DEBUG
      - REDIS_URL=redis://redis:6379/0
      - SERVICE_TYPE=worker
      - OBJC_DISABLE_INITIALIZE_FORK_SAFETY=YES
    command: python scripts/start_rq_worker.py
    depends_on:
      - redis
      - backend
    restart: unless-stopped

  rq-dashboard:
    container_name: tennis-coach-rq-dashboard
    image: python:3.11-slim
    ports:
      - "9181:9181"
    working_dir: /app
    environment:
      - REDIS_URL=redis://redis:6379/0
    command: >
      sh -c "
        pip install --no-cache-dir rq-dashboard &&
        rq-dashboard --redis-url=redis://redis:6379/0 --port=9181
      "
    depends_on:
      - redis
    restart: unless-stopped

volumes:
  redis_data:
  frontend_node_modules:
