[project]
name = "tennis-coach-api"
version = "0.1.0"
description = "Tennis coaching platform with computer vision analysis"
authors = [{name = "Aseda Ohene-Adu", email = "aoheneadu23@gmail.com"}]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.1",
    "uvicorn[standard]>=0.24.0",
    "python-multipart>=0.0.18",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    "opencv-python-headless>=4.8.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.12.0",
    "psutil>=5.9.0",
    "psycopg2-binary>=2.9.9",
    "supabase>=2.0.0",
    "redis>=5.0.0",
    "rq>=1.15.0",
    "slowapi>=0.1.9",
    "starlette>=0.36.2",
    "urllib3>=2.6.3",
    "pillow>=12.2.0",
    "h2>=4.3.0",
    "fonttools>=4.61.0",
    "filelock>=3.20.3",
    "anthropic>=0.40.0",
    "opencv-python>=4.13.0.92",
    "ultralytics>=8.4.14",
    "supervision>=0.27.0.post1",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[project.optional-dependencies]
api = [
    # API-specific dependencies (minimal)
]
worker = [
    # ML stack dependencies (only needed in worker)
    "mediapipe>=0.10.0",
    "torch>=2.6.0",
    "torchvision>=0.21.0",
    "scipy>=1.10.0",
    "ultralytics>=8.0.0",
    "supervision>=0.18.0",
]
dev = [
    "ruff>=0.1.0",
    "pyright>=1.1.0",
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.25.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "ANN", "B", "BLE", "SIM", "S", "RUF"]
ignore = ["E501", "D1", "D203", "D212", "D401", "FA102", "S311", "PERF401", "TRY003", "EM101", "B008", "S104", "S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN"]
"backend/tests/**/*.py" = ["ANN"]

[tool.pyright]
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"
include = ["app"]
exclude = ["**/__pycache__"]
typeCheckingMode = "basic"
# Suppress missing stubs for optional ML worker deps (not installed in local dev)
reportMissingModuleSource = "none"

[tool.ruff.lint.isort]
known-first-party = ["app"]
known-third-party = ["fastapi", "uvicorn", "sqlalchemy", "opencv", "torch", "torchvision", "scipy", "numpy", "pandas", "pydantic"]
