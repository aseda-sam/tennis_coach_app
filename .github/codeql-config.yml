name: "CodeQL Configuration"

# Suppress false positive log injection warnings
# These warnings appear when logging integer video_id values using parameterized logging,
# which is actually safe and follows security best practices.
# Parameterized logging (logger.warning("message %s", var)) prevents log injection attacks.
query-filters:
  - exclude:
      id:
        - js/log-injection
        - py/log-injection
