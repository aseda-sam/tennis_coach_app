name: CI

on:
  push:
    branches: [ main, develop, feature/** ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
      security-events: write
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/pyproject.toml'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -e ".[dev]"
          pip install ruff pytest pytest-cov httpx
          
      - name: Ruff format check (no changes allowed)
        run: ruff format --check .
        
      - name: Ruff lint (fail on issues)
        run: ruff check .
        
      - name: Run tests with coverage
        run: pytest -v --tb=short --cov=app --cov-report=xml --cov-report=term
        
      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        if: always()
        with:
          file: ./backend/coverage.xml
          flags: backend
          name: backend-coverage
          fail_ci_if_error: false  # Don't fail CI on coverage upload issues
        
      - name: Install Bandit
        run: pip install bandit
        
      - name: Run Bandit security scan
        run: bandit -r . -f json -o bandit-report.json || true
        
      - name: Upload Bandit results
        uses: actions/upload-artifact@v4
        if: always() && hashFiles('bandit-report.json') != ''
        with:
          name: bandit-report
          path: backend/bandit-report.json

  frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Lint
        run: npm run lint
        
      - name: Build
        run: npm run build
        
      - name: Test
        run: npm test -- --watchAll=false --coverage --passWithNoTests
