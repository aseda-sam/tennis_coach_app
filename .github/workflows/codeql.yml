name: CodeQL

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 0 * * 0" # Weekly scan on Sundays

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ["javascript-typescript", "python"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: +security-extended,security-and-quality # Enable additional security queries

      # Setup Node.js for JavaScript/TypeScript analysis
      - name: Setup Node.js (for JavaScript/TypeScript)
        if: matrix.language == 'javascript-typescript'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install frontend dependencies (for JavaScript/TypeScript)
        if: matrix.language == 'javascript-typescript'
        working-directory: frontend
        run: npm ci

      # Setup Python for Python analysis
      - name: Setup Python (for Python analysis)
        if: matrix.language == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11" # Match your backend Python version
          cache: "pip"
          cache-dependency-path: "backend/pyproject.toml"

      # Autobuild is not needed for JavaScript/TypeScript or Python
      # CodeQL can analyze these languages directly from source code

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
