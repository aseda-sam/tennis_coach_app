app = "tennis-coach-api"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[env]
  SERVICE_TYPE = "api"
  PROFILE = "production"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

# VM configuration - set BEFORE deploying to ensure machines are created with correct resources
# API requires at least 512MB RAM for stable operation
[[vm]]
  size = "shared-cpu-1x"
  memory_mb = 512